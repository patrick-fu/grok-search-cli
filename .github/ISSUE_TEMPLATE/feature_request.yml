name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep examples synthetic. Do not include tokens, cookies, full credential JSON, callback URLs,
        unredacted headers, usernames, absolute paths, real queries/answers, or `request_id` values.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest focused change, using synthetic data where needed.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
